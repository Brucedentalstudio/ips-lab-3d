<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPS Dental Lab · Xưởng 3D có bộ não AI</title>
<style>
:root { --teal: #0a8f8a; --teal-d: #066a66; --ink: #1d2b33; --mute: #64757f; --line: #dbe4e8; --ok: #1f9d5c; --bad: #d64533; --warn: #c98a12; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe3ee; color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

.panel { position: fixed; background: rgba(255, 255, 255, .9); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 12px; backdrop-filter: blur(8px); box-shadow: 0 8px 28px rgba(20, 50, 60, .16); }
.panel h2 { margin: 0 0 8px; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--teal-d);
  border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.hidden { display: none; }

#top { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; align-items: center; pointer-events: none; flex-wrap: wrap; }
#top .title { font-size: 19px; font-weight: 800; letter-spacing: .06em; color: var(--teal-d); margin-right: 6px;
  text-shadow: 0 1px 0 rgba(255,255,255,.8); }
#top .title span { font-weight: 500; letter-spacing: 0; color: var(--ink); }
.pill { padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; pointer-events: auto; }
.pill.demo { background: #fff3d6; color: #7a5200; border: 1px solid #e6c477; }
.pill.soft { background: rgba(255,255,255,.9); border: 1px solid var(--line); font-weight: 500; }
.pill.soft b { color: var(--teal-d); }

#left { top: 56px; left: 12px; width: 268px; max-height: calc(100% - 130px); overflow: auto; }
#right { top: 56px; right: 12px; width: 290px; max-height: 44%; overflow: auto; }
#card { right: 12px; bottom: 66px; width: 290px; }

.st { padding: 5px 0 7px; border-bottom: 1px dashed var(--line); font-size: 12.5px; }
.st:last-child { border-bottom: 0; }
.st .top { display: flex; justify-content: space-between; gap: 8px; }
.st .top b { font-weight: 650; }
.st .top span { color: var(--mute); font-variant-numeric: tabular-nums; white-space: nowrap; }
.st .bar { height: 5px; border-radius: 3px; background: #e8eef1; margin-top: 4px; overflow: hidden; }
.st .bar i { display: block; height: 100%; border-radius: 3px; background: var(--teal); transition: width .4s; }
.st.jam .top span { color: var(--bad); font-weight: 650; }

.row { font-size: 12.5px; line-height: 1.35; padding: 5px 0; border-bottom: 1px dashed var(--line); }
.row:last-child { border-bottom: 0; }
.row .code { font-weight: 650; font-variant-numeric: tabular-nums; }
.row .sub { color: var(--mute); display: block; font-size: 11.5px; }
.v-ok { color: var(--ok); font-weight: 650; } .v-bad { color: var(--bad); font-weight: 650; } .v-warn { color: var(--warn); font-weight: 650; }
.empty { font-size: 12.5px; color: var(--mute); font-style: italic; }

#card h3 { margin: 0 0 2px; font-size: 16px; color: var(--teal-d); }
#card .kv { font-size: 12.5px; margin: 3px 0; }
#card .kv b { color: var(--mute); font-weight: 500; }
#card .close { position: absolute; top: 6px; right: 10px; cursor: pointer; color: var(--mute); font-size: 15px; }
#card .note { font-size: 11px; color: var(--mute); margin-top: 6px; }

#bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 4px; align-items: center;
  background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 999px; padding: 5px 8px; box-shadow: 0 8px 28px rgba(20,50,60,.16); }
#bar button, #bar .link { font: inherit; font-size: 12.5px; color: var(--ink); background: transparent; border: 1px solid transparent;
  border-radius: 999px; padding: 6px 11px; cursor: pointer; text-decoration: none; white-space: nowrap; }
#bar button:hover, #bar .link:hover { border-color: var(--teal); }
#bar button.on { background: var(--teal); color: #fff; }
#bar .link { color: var(--teal-d); font-weight: 650; }
#bar .sep { width: 1px; height: 18px; background: var(--line); margin: 0 3px; }
#hint { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); font-size: 11.5px; color: var(--mute);
  pointer-events: none; white-space: nowrap; text-shadow: 0 1px 0 rgba(255,255,255,.7); }

.tag { position: absolute; transform: translate(-50%, -100%); text-align: center; white-space: nowrap; font-size: 11.5px; line-height: 1.2;
  background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px 4px; box-shadow: 0 2px 8px rgba(20,50,60,.14); }
.tag b { display: block; font-size: 12.5px; color: var(--teal-d); }
.tag.busy { border-color: var(--teal); }
.tag.jam { border-color: var(--bad); }
.tag.jam b { color: var(--bad); }
.float { position: absolute; transform: translate(-50%, -50%); font-weight: 800; font-size: 15px; white-space: nowrap;
  text-shadow: 0 1px 0 #fff, 0 0 8px #fff; animation: rise 2.4s ease-out forwards; }
@keyframes rise { from { opacity: 0; margin-top: 0; } 12% { opacity: 1; } to { opacity: 0; margin-top: -80px; } }

body.night .tag, body.night .panel, body.night #bar, body.night .pill.soft { background: rgba(24, 34, 44, .88); color: #e6eef2; border-color: #33454f; }
body.night #top .title span, body.night #bar button, body.night .st .top b { color: #e6eef2; }
body.night #top .title, body.night .panel h2, body.night .tag b, body.night #bar .link, body.night #card h3, body.night .pill.soft b { color: #58d6cf; text-shadow: none; }
body.night .st .bar { background: #33454f; }
body.night #hint { color: #b9c7ce; text-shadow: none; }

.tag.brain { background: #06363a; border-color: #58f0e6; color: #d8fffb; }
.tag.brain b { color: #7ff5ec; }
.tag.caby { border-color: var(--teal); }
.say { position: absolute; transform: translate(-50%, -100%); max-width: 210px; font-size: 11px; line-height: 1.3; padding: 4px 9px; border-radius: 10px;
  background: #fff; border: 1px solid var(--line); box-shadow: 0 3px 10px rgba(20,50,60,.18); text-align: center; }
.say.ask { background: #fff7dc; border-color: #e6c477; }
.say.ans { background: #06363a; border-color: #58f0e6; color: #d8fffb; }
.say.caby { background: #e3f6f5; border-color: var(--teal); font-weight: 600; }
.v-ai { color: var(--teal-d); }
@media (max-width: 900px) { #right, #hint { display: none; } }
@media (max-width: 640px) {
  #top { gap: 5px; top: 8px; left: 8px; right: 8px; }
  #top .title { font-size: 15px; width: 100%; }
  #top .title span { display: none; }
  .pill { font-size: 10.5px; padding: 3px 8px; }
  .pill.soft { white-space: normal; border-radius: 12px; }
  #left { top: auto; bottom: 62px; left: 8px; right: 8px; width: auto; max-height: 24%; padding: 8px 10px; }
  #card { left: 8px; right: 8px; width: auto; bottom: 62px; z-index: 2; }
  #bar { left: 8px; right: 8px; transform: none; bottom: 8px; justify-content: space-between; gap: 0; padding: 5px 4px; }
  #bar button, #bar .link { font-size: 10px; padding: 6px 3px; }
  #bar .sep { display: none; }
  .tag { font-size: 9px; padding: 2px 5px; }
  .tag b { font-size: 10px; }
  .say { font-size: 9px; max-width: 130px; padding: 3px 6px; }
}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="labels"></div>

<header id="top">
  <div class="title">IPS DENTAL LAB <span>· Xưởng 3D có bộ não AI</span></div>
  <div class="pill demo" title="Mọi đơn hàng, con số và nhân viên trên trang này là dữ liệu mẫu do máy tạo ra">MÔ PHỎNG · dữ liệu mẫu</div>
  <div id="kpi" class="pill soft"></div>
</header>

<aside id="left" class="panel">
  <h2>Công đoạn</h2>
  <div id="stations"></div>
</aside>

<aside id="right" class="panel">
  <h2>Nhật ký xưởng</h2>
  <div id="events"></div>
</aside>

<div id="card" class="panel hidden"></div>

<nav id="bar">
  <button data-view="all">Toàn cảnh</button>
  <button data-view="brain">Bộ não</button>
  <button data-view="design">Thiết kế</button>
  <button data-view="make">Chế tác</button>
  <button data-view="ship">QC và giao</button>
  <span class="sep"></span>
  <button id="btnNight">Ngày / Đêm</button>
  <a class="link" href="https://brucedentalstudio.github.io/bruce-team-3d/">Bruce Team ↗</a>
</nav>
<div id="hint">Kéo để xoay · cuộn để phóng to · bấm vào khay hàng hoặc nhân viên để xem · câu hỏi và trả lời là câu mẫu</div>
